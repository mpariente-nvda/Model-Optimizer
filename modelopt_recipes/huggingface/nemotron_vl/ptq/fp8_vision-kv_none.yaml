imports:
  base_disable_all: configs/ptq/units/base_disable_all
  vision_fp8: huggingface/nemotron_vl/ptq/vision_fp8.quant_cfg

metadata:
  recipe_type: ptq
  description: >-
    FP8 quantization of Nemotron 3 Nano Omni C-RADIO Vision Encoder Linear layers
    and the vision-to-language-model projector. The language model, audio branch,
    KV cache, patch generator, and vision-attention operands remain in high precision.

quantize:
  algorithm: max
  quant_cfg:
    - $import: base_disable_all
    - $import: vision_fp8
