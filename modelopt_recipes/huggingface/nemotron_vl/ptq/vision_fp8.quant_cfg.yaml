# FP8 Linear weights and inputs in the C-RADIO vision branch and the
# vision-to-language-model projector. Validated on NVIDIA Nemotron 3 Nano Omni.
# Patch generation and vision-attention operands remain in high precision.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerCfgListConfig
imports:
  fp8: configs/numerics/fp8
---
  # Support the two known HF layouts without using unanchored patterns that
  # could capture a future audio or language module with a similar name.
  - quantizer_name: 'vision_model.*weight_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: 'vision_model.*input_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: 'model.vision_model.*weight_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: 'model.vision_model.*input_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: 'mlp1.*weight_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: 'mlp1.*input_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: 'model.mlp1.*weight_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: 'model.mlp1.*input_quantizer'
    parent_class: 'nn.Linear'
    cfg:
      $import: fp8
  - quantizer_name: 'vision_model.*patch_generator*'
    enable: false
  - quantizer_name: 'model.vision_model.*patch_generator*'
    enable: false
